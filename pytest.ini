[pytest]
# Repo tests only; ./mmpose has its own pytest.ini and must never be collected from here.
testpaths = tests
pythonpath = .
norecursedirs = .git .venv .idea mmpose data models docs
addopts = -p no:cacheprovider
markers =
    gpu: needs a CUDA GPU (TensorRT tests also need the built engines in models/engines)
    slow: takes longer than about 30 s
