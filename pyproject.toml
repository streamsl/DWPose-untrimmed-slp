# slp-pose: DWPose whole-body keypoints for untrimmed sign-language videos. The tested, exact environments
# are requirements.txt (Python 3.11) and requirements-py38.txt (Python 3.8), which scripts/setup_env.sh
# installs; the ranges below admit both. README.md ('Installation') gives the pip-only route, and
# 'Adding a dataset' how a package provides datasets through the entry-point group "slp_pose.datasets".

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slp-pose"
dynamic = ["version"]
description = "DWPose whole-body keypoints for untrimmed sign-language videos, in the youtube-sl-25 schema"
readme = "README.md"
requires-python = ">=3.8,<3.12"   # torch 2.1 and the mmcv 2.1.0 wheels stop at 3.11
authors = [{ name = "Quan Dang" }]
# Exact where slp_pose.env checks the version at worker start-up, and the torchvision of that torch
# (the +cu121 builds match ==2.1.2 / ==0.16.2).
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "numpy>=1.20,<2",
    "opencv-python",
    "mmcv==2.1.0",
    "mmengine>=0.10,<1",
    "mmdet==3.3.0",
    "mmpose==1.3.2",
    "setuptools<82",   # mmengine imports pkg_resources, which setuptools 82 removed
]

[project.optional-dependencies]
# TensorRT engines (the default backend): TensorRT 10 from https://pypi.nvidia.com (tensorrt-cu12
# provides `import tensorrt` and pulls in its -libs and -bindings), plus the ONNX export tools of
# `build-engines` (onnxsim folds constants with ONNX Runtime).
trt = [
    "tensorrt-cu12>=10.13.3.9,<11",
    "onnx>=1.17",
    "onnxsim>=0.4.36",
    "onnxruntime",
]

[project.scripts]
slp-pose = "slp_pose.cli:main"

[tool.setuptools.dynamic]
version = { attr = "slp_pose.__version__" }

[tool.setuptools.packages.find]
include = ["slp_pose", "slp_pose.*"]

[tool.setuptools.package-data]
"slp_pose.model_configs" = ["*.py"]
